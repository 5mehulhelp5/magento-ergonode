<details class="ergonode-media-scan" open>
    <summary data-label="Local media index"></summary>
    <p data-role="status" role="status" aria-live="polite"></p>
    <p data-role="blocking"></p>
    <progress data-role="progress" max="100" hidden></progress>
    <p data-role="counts"></p>
    <p data-role="time"></p>
    <p data-role="last-success"></p>
    <p data-role="verification-time"></p>
    <p data-role="background" data-label="The scan runs in the background. You can leave this page."></p>
    <button type="button" class="action-default" data-role="start" disabled></button>
    <button type="button" class="action-default" data-role="verify" data-label="Verify file integrity" disabled></button>
    <p data-label="Verification runs only on request, in the background. You can leave this page. It reads all original product media and reports mapping mismatches without downloading or repairing files."></p>
    <button type="button" class="action-default" data-role="refresh" data-label="Refresh status"></button>
    <details data-role="errors" hidden>
        <summary data-label="Error details"></summary>
        <p data-role="error" role="alert"></p>
    </details>
</details>
